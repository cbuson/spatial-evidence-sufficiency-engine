[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-evidence-sufficiency-engine"
version = "1.0.0"
description = "Reference engine for bounded inference under incomplete spatial evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Carlos Busón Buesa"},
  {name = "Sandra Garcia Gabas"}
]
keywords = [
  "GIScience",
  "spatial-data-quality",
  "evidence-sufficiency",
  "bounded-inference",
  "reproducibility"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = []

[project.urls]
Repository = "https://github.com/cbuson/spatial-evidence-sufficiency-engine"

[tool.setuptools]
py-modules = ["evidence_sufficiency_engine"]
